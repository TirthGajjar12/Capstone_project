version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: it_asset_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-it_asset_db}
    # Keep database internal to the docker network for production deployments.
    # Exposing 5432 publicly allows unauthorized external connections.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: it_asset_fastapi
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "IT Asset & Support Ticket Management"
      APP_ENV: "production"
      DEBUG: "False"
      DB_HOST: "db"
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_NAME: ${POSTGRES_DB:-it_asset_db}
      SECRET_KEY: ${SECRET_KEY:-661d43321fd322efb3978d4306eea25549609d6ce05199634c32163af4c9de8e}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

  frontend:
    build: ./frontend
    container_name: it_asset_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
